<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heti takarításom</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f2;color:#36594b;padding:16px}
main{max-width:520px;margin:auto}
h1{text-align:center;font-size:25px}
p{text-align:center;color:#777}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0}
button{border:0;border-radius:10px;padding:11px;background:#e1e9e3;color:#36594b;cursor:pointer}
button.active{background:#547568;color:white}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0}
.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.task input{width:19px;height:19px;accent-color:#547568}
.task.done span{text-decoration:line-through;color:#999}
.bar{height:8px;background:#79a58d;width:0;border-radius:8px}
.track{background:#eee;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>🌿 Heti takarításom</h1>
<p>Apró lépések, rendezettebb otthon ❤️</p>
<div class="days" id="days"></div>
<section class="card">
<h3 id="heading"></h3>
<p id="count"></p>
<div class="track"><div class="bar" id="bar"></div></div>
<div id="tasks"></div>
</section>
<p>A pipáid automatikusan mentődnek ezen az eszközön.</p>
</main>
<script>
const names=["Hétfő","Kedd","Szerda","Csütörtök","Péntek","Szombat","Vasárnap"];
const fixed=["Ágy bevetése","Szellőztetés","Mosogatás","Konyhapult letörlése","10 perc rendrakás"];
const extras=[
["Mosdó áttörlése","Törölközők rendezése"],
["Por törlése","Szemét ellenőrzése"],
["Porszívózás","Növények ellenőrzése"],
["Tükör letörlése","Konyha rendbetétele"],
["Felmosás egy kisebb részen","Hűtő gyors átnézése"],
["Egy polc rendbetétele","Takarók rendezése"],
["Következő hét előkészítése","Kedvenc helyiség rendbetétele"]
];
let day=0;
function weekKey(){
 const d=new Date();
 d.setHours(0,0,0,0);
 d.setDate(d.getDate()-((d.getDay()+6)%7));
 return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}
const key="mimi-clean-"+weekKey();
let data={};
try{data=JSON.parse(localStorage.getItem(key)||"{}")||{};}catch(e){}
function defaults(i){return [...fixed,...extras[i]].map(text=>({text,done:false}));}
function save(){try{localStorage.setItem(key,JSON.stringify(data));}catch(e){}}
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){
 document.getElementById("days").innerHTML=names.map((n,i)=>'<button class="'+(i===day?'active':'')+'" onclick="selectDay('+i+')">'+n+'</button>').join("");
 document.getElementById("heading").textContent=names[day];
 if(!data[day])data[day]=defaults(day);
 const list=data[day];
 document.getElementById("tasks").innerHTML=list.map((t,i)=>'<label class="task '+(t.done?'done':'')+'"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggle('+i+',this.checked)"><span>'+escapeText(t.text)+'</span></label>').join("");
 const done=list.filter(t=>t.done).length;
 document.getElementById("count").textContent=done+" / "+list.length+" feladat kész";
 document.getElementById("bar").style.width=(list.length?done/list.length*100:0)+"%";
 save();
}
function selectDay(i){day=i;render();}
function toggle(i,value){data[day][i].done=value;render();}
render();
</script>
</body>
</html>
