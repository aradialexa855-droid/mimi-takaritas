<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff5fa">
<title>Heti takarításom ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #df82a6;
  --dark: #b9547c;
  --pale: #ffe4ef;
  --text: #674957;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px 13px;
  font-family: "Nunito", "Trebuchet MS", Arial, sans-serif;
  background-color: #fff5fa;
  background-image:
    radial-gradient(circle at 12% 15%, #f5a8ca 0 3px, transparent 4px),
    radial-gradient(circle at 80% 10%, #d9b8ff 0 4px, transparent 5px),
    radial-gradient(circle at 45% 35%, #ffccdf 0 5px, transparent 6px),
    radial-gradient(circle at 90% 55%, #e0c5ff 0 3px, transparent 4px),
    radial-gradient(circle at 15% 75%, #ffbfd8 0 4px, transparent 5px),
    radial-gradient(circle at 65% 85%, #f5c8e0 0 5px, transparent 6px);
  background-size: 120px 130px, 140px 150px, 160px 170px, 130px 140px, 150px 160px, 170px 180px;
  color: var(--text);
  min-height: 100vh;
}
main { max-width: 520px; margin: auto; }
header { text-align: center; padding: 12px 5px 20px; }
.flower { font-size: 36px; }
h1 {
  font-family: "Caveat", "Comic Sans MS", cursive;
  font-size: 36px;
  line-height: 1.15;
  color: var(--dark);
  margin: 8px 0;
}
.subtitle {
  font-family: "Caveat", "Comic Sans MS", cursive;
  font-size: 21px;
  color: #987d8b;
  margin: 8px 0;
}
.card {
  background: rgba(255,255,255,.95);
  border: 1px solid #f7e3eb;
  border-radius: 23px;
  padding: 19px 16px;
  margin: 14px 0;
  box-shadow: 0 8px 25px #9f718410;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h2 {
  font-family: "Caveat", "Comic Sans MS", cursive;
  font-size: 28px;
  color: var(--dark);
  margin: 0;
}
.days {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0 18px;
}
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.day {
  border: 1px solid #f3d5e1;
  border-radius: 14px;
  padding: 10px 2px;
  background: rgba(255,255,255,.94);
  color: #956b7d;
  font-size: 12px;
}
.day.active { background: var(--pink); color: white; border-color: var(--pink); }
.day .symbol { display: block; font-size: 18px; margin-bottom: 3px; }
.day .dayname { display: block; }
.day .percent { display: block; font-size: 10px; margin-top: 3px; }
.label { font-size: 13px; color: #9a8190; margin: 12px 0 9px; }
.track { height: 11px; background: #fbe7ef; border-radius: 20px; overflow: hidden; }
.bar {
  height: 100%; width: 0; border-radius: 20px;
  background: linear-gradient(90deg, #e9a0bd, #ce79a0);
  transition: width .25s;
}
.week-summary { font-size: 13px; color: #987d8b; margin: 8px 0 13px; }
.week-track { height: 9px; background: #fbe7ef; border-radius: 20px; overflow: hidden; }
.week-bar {
  height: 100%; width: 0;
  background: linear-gradient(90deg, #e9a0bd, #b9a5e8);
  transition: width .25s;
}
#message {
  font-family: "Caveat", "Comic Sans MS", cursive;
  background: #fff3f7;
  border-radius: 14px;
  text-align: center;
  padding: 13px 9px;
  margin-top: 14px;
  font-size: 21px;
  color: #a45e7c;
  line-height: 1.35;
}
.task-title { font-size: 14px; font-weight: 800; color: #a47589; margin: 22px 0 5px; }
.task {
  display: flex; align-items: center; gap: 12px; padding: 14px 3px;
  border-bottom: 1px solid #f7edf1; cursor: pointer;
  font-size: 16px; line-height: 1.4;
}
.task input {
  appearance: none; -webkit-appearance: none; flex-shrink: 0;
  width: 25px; height: 25px; margin: 0;
  border: 2px solid #e8b6ca; border-radius: 9px; background: white; cursor: pointer;
}
.task input:checked { background: var(--pink); border-color: var(--pink); }
.task input:checked::after {
  content: "✓"; display: block; color: white; font-size: 18px;
  line-height: 21px; text-align: center; font-weight: bold;
}
.task.done span { text-decoration: line-through; color: #b8a8b0; }
.footer {
  font-family: "Caveat", "Comic Sans MS", cursive;
  text-align: center; color: #a38a97; font-size: 18px;
  line-height: 1.5; padding: 8px 12px 18px;
}
@media (max-width: 360px) {
  h1 { font-size: 32px; }
  h2 { font-size: 25px; }
  .card { padding: 16px 12px; }
  .task { font-size: 15px; }
}
</style>
</head>
<body>
<main>
<header>
  <div class="flower">🌷 🧹 🌷</div>
  <h1>Heti takarításom ♡</h1>
  <p class="subtitle">Apró lépések, szeretettel gondozott otthon ♡</p>
</header>

<section class="card">
  <div class="top">
    <h2>♡ Heti naptáram</h2>
    <span>🗓️</span>
  </div>
  <p class="week-summary" id="weekCount"></p>
  <div class="week-track"><div class="week-bar" id="weekBar"></div></div>
  <div class="days" id="days"></div>
</section>

<section class="card">
  <div class="top">
    <h2 id="heading">Hétfő</h2>
    <span style="font-size:25px">💗</span>
  </div>
  <p class="label" id="count"></p>
  <div class="track"><div class="bar" id="bar"></div></div>
  <div id="message">🌸 Minden apró lépés számít!</div>

  <p class="task-title">♡ Mindennapi feladatok</p>
  <div id="fixedTasks"></div>
  <p class="task-title">✿ Mai kis extra feladatok</p>
  <div id="extraTasks"></div>
</section>

<p class="footer">
  🌸 Lassan is haladhatsz, a lényeg, hogy haladj!<br>
  💕 A pipáid ezen az eszközön mentődnek.
</p>
</main>

<script>
const names = ["Hétfő", "Kedd", "Szerda", "Csütörtök", "Péntek", "Szombat", "Vasárnap"];
const shortNames = ["H", "K", "Sze", "Cs", "P", "Szo", "V"];
const fixed = ["Ágy bevetése", "Szellőztetés", "Mosogatás", "Konyhapult letörlése", "10 perc rendrakás"];
const extras = [
  ["Mosdó áttörlése", "Törölközők rendezése"],
  ["Por törlése", "Szemét ellenőrzése"],
  ["Porszívózás", "Növények ellenőrzése"],
  ["Tükör letörlése", "Konyha rendbetétele"],
  ["Felmosás egy kisebb részen", "Hűtő gyors átnézése"],
  ["Egy polc rendbetétele", "Takarók rendezése"],
  ["Következő hét előkészítése", "Kedvenc helyiség rendbetétele"]
];

let day = 0;

function weekKey() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

/* Fontos: a meglévő mentési kulcsot megtartjuk, hogy a heti pipák megmaradjanak. */
const key = "mimi-clean-" + weekKey();
let data = {};
try {
  data = JSON.parse(localStorage.getItem(key) || "{}") || {};
} catch (e) {
  data = {};
}

function defaults(i) {
  return [...fixed, ...extras[i]].map(text => ({ text, done: false }));
}
function getList(i) {
  if (!Array.isArray(data[i])) data[i] = defaults(i);
  return data[i];
}
function save() {
  try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
}
function escapeText(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function stats(i) {
  const list = getList(i);
  const done = list.filter(t => t.done).length;
  return { list, done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
}
function renderWeek() {
  let allDone = 0, allTasks = 0, completedDays = 0;
  const dayHTML = names.map((name, i) => {
    const s = stats(i);
    allDone += s.done;
    allTasks += s.total;
    if (s.pct === 100) completedDays++;
    const symbol = s.pct === 100 ? "♥" : s.pct > 0 ? "✓" : "♡";
    return '<button type="button" class="day ' + (i === day ? "active" : "") +
      '" onclick="selectDay(' + i + ')">' +
      '<span class="symbol">' + symbol + '</span>' +
      '<span class="dayname">' + shortNames[i] + '</span>' +
      '<span class="percent">' + s.pct + '%</span></button>';
  }).join("");
  document.getElementById("days").innerHTML = dayHTML;
  document.getElementById("weekCount").textContent =
    completedDays + " / 7 nap teljesen kész · " + allDone + " / " + allTasks + " feladat";
  document.getElementById("weekBar").style.width = (allTasks ? allDone / allTasks * 100 : 0) + "%";
}
function render() {
  const s = stats(day);
  const list = s.list;
  document.getElementById("heading").textContent = names[day];
  document.getElementById("count").textContent = s.done + " / " + s.total + " feladat kész · " + s.pct + "%";
  document.getElementById("bar").style.width = s.pct + "%";

  function taskHTML(t, i) {
    return '<label class="task ' + (t.done ? "done" : "") + '">' +
      '<input type="checkbox" ' + (t.done ? "checked" : "") +
      ' onchange="toggle(' + i + ',this.checked)">' +
      '<span>' + escapeText(t.text) + '</span></label>';
  }
  document.getElementById("fixedTasks").innerHTML = list.slice(0, fixed.length).map(taskHTML).join("");
  document.getElementById("extraTasks").innerHTML = list.slice(fixed.length).map((t, i) => taskHTML(t, i + fixed.length)).join("");

  let message = "🌸 Minden apró lépés számít! Kezdj egy kis feladattal.";
  if (s.pct === 100) {
    message = "🎉🌷 Minden kész mára! Nagyon ügyes vagy! 💖 Megérdemelsz egy kis pihenést.";
  } else if (s.pct >= 60) {
    message = "✨ Már a nagy részével megvagy! Csodásan haladsz! 💕";
  } else if (s.done > 0) {
    message = "💗 Már elkezdted, és ez számít! Haladj a saját tempódban.";
  }
  if (names.every((_, i) => stats(i).pct === 100)) {
    message = "🏆🌸 AZ EGÉSZ HÉT KÉSZ! Fantasztikus vagy! Jöhet a jól megérdemelt pihenés! 💖";
  }
  document.getElementById("message").textContent = message;
  renderWeek();
  save();
}
function selectDay(i) {
  day = i;
  render();
}
function toggle(i, value) {
  getList(day)[i].done = value;
  render();
}
render();
</script>
</body>
</html>
